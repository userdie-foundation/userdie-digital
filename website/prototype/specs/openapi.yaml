openapi: 3.1.0
info:
  title: USERDIE Digital API
  version: 0.1.0-draft
  description: |
    Проектная спецификация API USERDIE Digital.
    Не является описанием уже развёрнутого backend. До реализации требуется
    правовая проверка, согласование владельцев данных, модель угроз,
    тестирование разграничения доступа и утверждение архитектуры.
  contact:
    name: USERDIE Digital architecture
servers:
  - url: https://api.example.invalid/v1
    description: Placeholder only — production host is not assigned.
tags:
  - name: Requests
    description: Обращения и дела фонда.
  - name: Programs
    description: Программы и проекты фонда.
  - name: Partners
    description: Партнёры и ограниченные гранты доступа.
  - name: Assets
    description: Реестр активов и экспертная оценка.
  - name: Audit
    description: Контролируемый просмотр событий аудита.
security:
  - bearerAuth: []
paths:
  /requests:
    get:
      tags: [Requests]
      operationId: listRequests
      summary: Получить доступные пользователю обращения
      description: |
        Возвращает только дела, доступные субъекту по роли, назначению и области
        доступа. По умолчанию персональные идентификаторы исключены.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [received, verification, assigned, in_review, decision_pending, in_progress, closed, rejected]
        - name: programId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Страница доступных обращений.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Requests]
      operationId: createRequest
      summary: Зарегистрировать обращение
      description: |
        Создаёт обращение. Передача минимально необходимых данных, проверка
        правового основания и отдельный защищённый канал для чувствительных
        сведений обязательны. Операция не означает автоматического одобрения помощи.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCreate'
      responses:
        '201':
          description: Обращение зарегистрировано.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestRecord'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Requests]
      operationId: getRequest
      summary: Получить карточку доступного обращения
      responses:
        '200':
          description: Карточка обращения в пределах полномочий.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestRecord'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Requests]
      operationId: updateRequest
      summary: Изменить разрешённые поля обращения
      description: |
        Допустимые переходы статуса проверяются сервером. Каждое изменение
        создаёт AuditEvent и запись истории статуса. Нельзя менять автора
        первоначальной записи или обходить обязательное согласование.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestUpdate'
      responses:
        '200':
          description: Обращение обновлено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestRecord'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /programs:
    get:
      tags: [Programs]
      operationId: listPrograms
      summary: Получить программы и проекты
      security: []
      responses:
        '200':
          description: Публичные или доступные пользователю программы.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Program' }
  /partners:
    get:
      tags: [Partners]
      operationId: listPartners
      summary: Получить партнёров в пределах доступа
      responses:
        '200':
          description: Доступный перечень партнёров.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Partner' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /assets:
    get:
      tags: [Assets]
      operationId: listAssets
      summary: Получить доступные активы
      responses:
        '200':
          description: Доступные записи реестра активов.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Asset' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /assets/{assetId}/valuations:
    parameters:
      - name: assetId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Assets]
      operationId: submitValuation
      summary: Передать экспертную оценку на рассмотрение
      description: |
        Создаёт проект оценки. Утверждение требует независимого проверяющего
        и не может быть выполнено автором оценки в рамках той же процедуры.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValuationSubmission'
      responses:
        '202':
          description: Оценка принята на рассмотрение, но не утверждена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Valuation'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: Получить разрешённые события аудита
      description: |
        Доступ только уполномоченным аудиторам и администраторам по отдельному
        разрешению. Секреты, токены и полные значения чувствительных полей
        в ответ не включаются.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: objectType
          in: query
          schema: { type: string, enum: [request, asset, partner, role_assignment, system] }
        - name: objectId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Разрешённые события аудита.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Проектная схема. Конкретный Identity Provider и жизненный цикл токенов подлежат отдельному утверждению.
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Уникальный ключ клиента для безопасного повтора команды.
      schema: { type: string, minLength: 16, maxLength: 128 }
  responses:
    BadRequest:
      description: Некорректный запрос.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthorized:
      description: Требуется аутентификация.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Недостаточно полномочий или область доступа не разрешена.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Объект не найден или недоступен вызывающему субъекту.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Конфликт состояния или повтор команды с другим содержимым.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ValidationError:
      description: Ошибка проверки полей или бизнес-правил.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RateLimited:
      description: Превышен лимит запросов.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    RequestCreate:
      type: object
      additionalProperties: false
      required: [programId, subject, legalBasisReference]
      properties:
        programId: { type: string, format: uuid }
        subject: { type: string, minLength: 5, maxLength: 300 }
        description: { type: string, maxLength: 5000 }
        legalBasisReference: { type: string, minLength: 1, maxLength: 120 }
        preferredContactChannel:
          type: string
          enum: [phone, email, in_person, other]
    RequestUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        subject: { type: string, minLength: 5, maxLength: 300 }
        description: { type: string, maxLength: 5000 }
        status:
          type: string
          enum: [verification, assigned, in_review, decision_pending, in_progress, closed, rejected]
        resolutionNote: { type: string, maxLength: 2000 }
    RequestRecord:
      type: object
      required: [id, reference, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        reference: { type: string, description: Псевдонимизированный номер обращения. }
        subject: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [received, verification, assigned, in_review, decision_pending, in_progress, closed, rejected]
        programId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RequestPage:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RequestRecord' }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    Program:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        summary: { type: string, maxLength: 1000 }
        status: { type: string, enum: [draft, active, paused, completed, archived] }
    Partner:
      type: object
      required: [id, name, accessScope]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        accessScope:
          type: string
          enum: [public_profile, assigned_project, explicitly_shared_case]
    Asset:
      type: object
      required: [id, title, classification, valuationStatus]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 250 }
        classification: { type: string, maxLength: 100 }
        valuationStatus:
          type: string
          enum: [not_assessed, draft, under_review, approved, rejected, expired]
    ValuationSubmission:
      type: object
      additionalProperties: false
      required: [methodology, currency, value, valuationDate, evidenceReferences]
      properties:
        methodology: { type: string, minLength: 3, maxLength: 300 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        value: { type: number, exclusiveMinimum: 0 }
        valuationDate: { type: string, format: date }
        evidenceReferences:
          type: array
          minItems: 1
          items: { type: string, maxLength: 200 }
        assumptions: { type: string, maxLength: 4000 }
    Valuation:
      type: object
      required: [id, assetId, status, submittedAt]
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        status: { type: string, enum: [draft, under_review, approved, rejected] }
        submittedAt: { type: string, format: date-time }
        approvedAt: { type: [string, 'null'], format: date-time }
    AuditEvent:
      type: object
      required: [id, occurredAt, actorReference, action, objectType, objectReference, outcome]
      properties:
        id: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time }
        actorReference: { type: string }
        action: { type: string, maxLength: 120 }
        objectType: { type: string }
        objectReference: { type: string }
        outcome: { type: string, enum: [success, denied, failure] }
        correlationId: { type: string }
    ApiError:
      type: object
      required: [code, message, correlationId]
      properties:
        code: { type: string }
        message: { type: string, maxLength: 500 }
        correlationId: { type: string }
