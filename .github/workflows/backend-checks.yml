name: Backend checks

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: userdie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d userdie_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run automated tests
        env:
          PG_INTEGRATION_URL: postgresql://postgres:postgres@localhost:5432/userdie_test
        run: npm test
      - name: Build production container image
        run: docker build --pull -f Dockerfile -t userdie-digital-api:ci .
      - name: Smoke-test production container
        env:
          DATABASE_URL: postgresql://synthetic:synthetic@127.0.0.1:1/userdie_test
        run: |
          set -euo pipefail
          docker run --detach --name userdie-api-smoke \
            --publish 127.0.0.1:18080:8080 \
            --env PORT=8080 \
            --env DATABASE_URL="$DATABASE_URL" \
            userdie-digital-api:ci
          trap 'docker rm --force userdie-api-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18080/api/v1/health/live >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/api/v1/health/live
          ready_status="$(curl --silent --output /tmp/userdie-ready.json --write-out '%{http_code}' http://127.0.0.1:18080/api/v1/health/ready)"
          test "$ready_status" = "503"
          test "$(docker exec userdie-api-smoke id -u)" = "1000"
          grep -Fq '"status":"unavailable"' /tmp/userdie-ready.json
          echo "Container smoke test passed: non-root runtime, live endpoint, fail-closed database readiness."
