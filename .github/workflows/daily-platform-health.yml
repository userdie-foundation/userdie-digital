name: Daily platform health check
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy public website"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: platform-health-check
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
      - name: Check required 404 page
        id: page404
        run: test -s website/404.html
      - name: Check internal links and anchors
        id: links
        run: node .github/scripts/check-site-links.mjs
      - name: Check inline JavaScript syntax
        id: javascript
        run: node .github/scripts/check-inline-js.mjs
      - name: Validate visual enhancement assets
        id: visual_assets
        run: node .github/scripts/apply-visual-enhancements.mjs --check
      - name: Check website deployment result
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            read -r status conclusion < <(jq -r '.workflow_run | [.status // "missing", .conclusion // "pending"] | @tsv' "$GITHUB_EVENT_PATH")
            if [ "$status" = "completed" ] && [ "$conclusion" = "cancelled" ]; then
              echo "::notice::This deployment run was cancelled or superseded by a newer commit; checking the latest successful deployment separately."
              run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-website.yml/runs?branch=main&status=success&per_page=1")"
              read -r success_status success_conclusion < <(printf '%s' "$run_json" | jq -r '.workflow_runs[0] | [.status // "missing", .conclusion // "missing"] | @tsv')
              if [ "$success_status" = "completed" ] && [ "$success_conclusion" = "success" ]; then
                echo "A successful website deployment is available; cancelled superseded run is non-blocking."
              else
                echo "::error::No successful website deployment found after the cancelled run."
                exit 1
              fi
              exit 0
            fi
          else
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-website.yml/runs?branch=main&status=completed&per_page=1")"
            read -r status conclusion < <(printf '%s' "$run_json" | jq -r '.workflow_runs[0] | [.status // "missing", .conclusion // "pending"] | @tsv')
          fi
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            echo "::error::Website deployment check failed (status=$status, conclusion=$conclusion)."
            exit 1
          fi
          echo "Website deployment completed successfully."
      - name: Check custom-domain HTTPS readiness (non-blocking)
        id: domain
        run: |
          if curl --fail --location --silent --show-error --max-time 25 https://xn--d1abbl2ben.online/ --output /dev/null; then
            echo "status=PASS — HTTPS доступен" >> "$GITHUB_OUTPUT"
            echo "Custom-domain HTTPS check passed."
          else
            echo "status=WARNING — HTTPS не подтверждён" >> "$GITHUB_OUTPUT"
            echo "::warning::Custom-domain HTTPS is not verified yet. Keep DNS and certificate readiness as a separate release task; repository, link and deployment checks are independent."
          fi
      - name: Check public discovery endpoints and verification file
        id: discovery
        run: |
          set -euo pipefail
          base="https://xn--d1abbl2ben.online"
          robots="$(curl --fail --location --silent --show-error --max-time 25 "$base/robots.txt")"
          if ! grep -Fq -- "Sitemap: $base/sitemap.xml" <<< "$robots"; then
            echo "::error::robots.txt does not advertise the expected sitemap URL."
            exit 1
          fi
          echo "robots.txt OK."
          sitemap="$(curl --fail --location --silent --show-error --max-time 25 "$base/sitemap.xml")"
          url_count="$(printf '%s' "$sitemap" | grep -o '<loc>' | wc -l | tr -d ' ')"
          if [ "$url_count" -ne 8 ]; then
            echo "::error::Expected 8 sitemap URLs, received $url_count."
            exit 1
          fi
          echo "Sitemap OK: $url_count URLs."
          verification="$(curl --fail --location --silent --show-error --max-time 25 "$base/yandex_85472297227dd2a2.html")"
          if ! grep -Fq -- "Verification: 85472297227dd2a2" <<< "$verification"; then
            echo "::error::Yandex verification file is reachable but its expected token is missing."
            exit 1
          fi
          echo "Yandex verification file OK."
          while IFS='|' read -r path canonical; do
            html="$(curl --fail --location --silent --show-error --max-time 25 "$base$path")"
            if ! grep -Fq -- "<link rel=\\"canonical\\" href=\\"$base$canonical\\">" <<< "$html"; then
              echo "::error::Canonical URL mismatch on $path (expected $base$canonical)."
              exit 1
            fi
            if ! grep -Fq -- "<meta property=\\"og:url\\" content=\\"$base$canonical\\">" <<< "$html"; then
              echo "::error::Open Graph URL mismatch on $path (expected $base$canonical)."
              exit 1
            fi
            echo "Public page and canonical/OG URL OK: $path"
          done <<'PUBLIC_PAGES'
          /|/
          /prototype/aid-directions.html|/prototype/aid-directions.html
          /prototype/applicant-cabinet.html|/prototype/applicant-cabinet.html
          /prototype/partner-space.html|/prototype/partner-space.html
          /prototype/platform.html|/prototype/platform.html
          /prototype/project-portfolio.html|/prototype/project-portfolio.html
          /prototype/resource-base.html|/prototype/resource-base.html
          /prototype/assets-and-intellectual-capital.html|/prototype/assets-and-intellectual-capital.html
          PUBLIC_PAGES
          echo "status=PASS — robots.txt, sitemap (8 URL), Yandex verification, 8 pages and canonical/OG URLs" >> "$GITHUB_OUTPUT"
          echo "Public discovery endpoints, all 8 sitemap pages and canonical/OG URLs passed."
      - name: Publish readable health report
        id: report
        if: always()
        env:
          CHECK_404: ${{ steps.page404.outcome || 'not-run' }}
          CHECK_LINKS: ${{ steps.links.outcome || 'not-run' }}
          CHECK_JS: ${{ steps.javascript.outcome || 'not-run' }}
          CHECK_VISUAL: ${{ steps.visual_assets.outcome || 'not-run' }}
          CHECK_DEPLOY: ${{ steps.deployment.outcome || 'not-run' }}
          CHECK_DOMAIN: ${{ steps.domain.outputs.status || 'not-run' }}
          CHECK_DISCOVERY: ${{ steps.discovery.outputs.status || steps.discovery.outcome || 'not-run' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          JOB_RESULT: ${{ job.status }}
        run: |
          {
            echo "# USERDIE DIGITAL — отчёт технического контроля"
            echo
            echo "- Результат задания: **$JOB_RESULT**"
            echo "- Запуск: [$GITHUB_RUN_ID]($RUN_URL)"
            echo "- Событие: $EVENT_NAME"
            echo "- Commit: `$COMMIT_SHA`"
            echo "- Время формирования: $(date -u +'%Y-%m-%d %H:%M UTC')"
            echo
            echo "| Проверка | Результат |"
            echo "|---|---|"
            echo "| Страница 404 | $CHECK_404 |"
            echo "| Внутренние ссылки и якоря | $CHECK_LINKS |"
            echo "| Синтаксис JavaScript | $CHECK_JS |"
            echo "| Визуальные ресурсы | $CHECK_VISUAL |"
            echo "| Результат публикации | $CHECK_DEPLOY |"
            echo "| HTTPS пользовательского домена | $CHECK_DOMAIN |"
            echo "| robots, sitemap, Яндекс, публичные страницы и canonical/OG | $CHECK_DISCOVERY |"
            echo
            echo "Автопроверка не заменяет ручную проверку сайта в браузере. Предупреждение по домену не отменяет независимые проверки репозитория и публикации."
          } | tee platform-health-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload health report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: userdie-platform-health-report-${{ github.run_id }}
          path: platform-health-report.md
          if-no-files-found: warn

      - name: Notify office about failed checks
        if: failure()
        uses: actions/github-script@v7
        env:
          CHECK_404: ${{ steps.page404.outcome || 'not-run' }}
          CHECK_LINKS: ${{ steps.links.outcome || 'not-run' }}
          CHECK_JS: ${{ steps.javascript.outcome || 'not-run' }}
          CHECK_VISUAL: ${{ steps.visual_assets.outcome || 'not-run' }}
          CHECK_DEPLOY: ${{ steps.deployment.outcome || 'not-run' }}
          CHECK_DOMAIN: ${{ steps.domain.outputs.status || 'not-run' }}
          CHECK_DISCOVERY: ${{ steps.discovery.outputs.status || steps.discovery.outcome || 'not-run' }}
        with:
          script: |
            const title = 'Автоотчёт USERDIE DIGITAL — требуется внимание';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## Автоматический отчёт технического контроля',
              '',
              'Проверка завершилась с ошибкой. Это уведомление не выполняет автоматическое исправление кода.',
              '',
              `- Запуск: [${context.runId}](${runUrl})`,
              `- Commit: ${context.sha}`,
              `- Событие: ${context.eventName}`,
              '',
              '| Проверка | Результат |',
              '|---|---|',
              `| Страница 404 | ${process.env.CHECK_404} |`,
              `| Внутренние ссылки и якоря | ${process.env.CHECK_LINKS} |`,
              `| Синтаксис JavaScript | ${process.env.CHECK_JS} |`,
              `| Визуальные ресурсы | ${process.env.CHECK_VISUAL} |`,
              `| Публикация | ${process.env.CHECK_DEPLOY} |`,
              `| HTTPS домена | ${process.env.CHECK_DOMAIN} |`,
              `| robots, sitemap, Яндекс, публичные страницы и canonical/OG | ${process.env.CHECK_DISCOVERY} |`,
              '',
              'Следующий шаг: изучить журнал запуска, воспроизвести проблему и исправить её отдельным проверяемым изменением.'
            ].join('\n');
            const { owner, repo } = context.repo;
            const response = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = response.data.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              core.info(`Updated existing tracking issue #${existing.number}.`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              core.info(`Created tracking issue #${created.data.number}.`);
            }
