name: Deploy public website
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
      - ".github/scripts/**"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check internal website links
        run: node .github/scripts/check-site-links.mjs
      - name: Check inline JavaScript syntax
        run: node .github/scripts/check-inline-js.mjs
      - name: Validate visual enhancement assets
        run: node .github/scripts/apply-visual-enhancements.mjs --check
      - name: Apply visual enhancement layer to published HTML
        run: node .github/scripts/apply-visual-enhancements.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
